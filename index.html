<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Breakout Arcade Retro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #14142b 0%, #080811 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 50px rgba(0, 255, 204, 0.25), 0 0 20px rgba(255, 0, 128, 0.2);
      border-radius: 12px;
      padding: 12px;
      background: rgba(18, 18, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 800px;
      max-width: 95vw;
      padding: 8px 16px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-label {
      color: #8c8ea7;
      text-transform: uppercase;
      font-size: 11px;
    }

    .hud-val {
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
      font-size: 18px;
      font-family: monospace;
    }

    #lives-container {
      display: flex;
      gap: 4px;
    }

    .heart-icon {
      color: #ff2a6d;
      filter: drop-shadow(0 0 5px rgba(255, 42, 109, 0.8));
    }

    canvas {
      width: min(800px, 95vw);
      height: auto;
      aspect-ratio: 800 / 560;
      background: #05050d;
      border-radius: 8px;
      border: 2px solid #1f2038;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
      display: block;
      cursor: none;
      touch-action: none;
    }

    /* Overlays (Start, Game Over, Win, Pause) */
    .overlay {
      position: absolute;
      top: 55px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: rgba(5, 5, 13, 0.88);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(4px);
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h1 {
      font-size: 46px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #00f3ff, #ff2a6d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.5));
    }

    .overlay p {
      font-size: 16px;
      color: #b0b3c8;
      margin-bottom: 24px;
      text-align: center;
      max-width: 480px;
      line-height: 1.5;
    }

    .btn {
      background: linear-gradient(135deg, #00f3ff, #0077fe);
      color: #050510;
      border: none;
      padding: 12px 32px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.7);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .controls-hint {
      margin-top: 24px;
      font-size: 12px;
      color: #656782;
      display: flex;
      gap: 16px;
    }

    .key-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eee;
    }

    /* Sound toggle */
    .icon-btn {
      background: transparent;
      border: none;
      color: #8c8ea7;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .icon-btn:hover {
      color: #00f3ff;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">Puntos</span>
        <span id="score-val" class="hud-val">00000</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Récord</span>
        <span id="highscore-val" class="hud-val">00000</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Nivel</span>
        <span id="level-val" class="hud-val">1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Vidas</span>
        <div id="lives-container"></div>
      </div>
      <button id="sound-btn" class="icon-btn" title="Activar/Silenciar Sonido">🔊</button>
    </div>

    <canvas id="gameCanvas" width="800" height="560"></canvas>

    <!-- Overlay de Inicio -->
    <div id="start-overlay" class="overlay">
      <h1>BREAKOUT</h1>
      <p>Destruye todos los bloques, recolecta potenciadores especiales y no dejes caer la bola.</p>
      <button id="start-btn" class="btn">JUGAR</button>
      <div class="controls-hint">
        <span><span class="key-badge">◄ ►</span> o <span class="key-badge">Mouse</span>: Mover</span>
        <span><span class="key-badge">ESPACIO</span>: Lanzar / Disparar</span>
        <span><span class="key-badge">P</span>: Pausa</span>
      </div>
    </div>

    <!-- Overlay de Pausa -->
    <div id="pause-overlay" class="overlay hidden">
      <h1>PAUSA</h1>
      <p>Juego en pausa</p>
      <button id="resume-btn" class="btn">CONTINUAR</button>
    </div>

    <!-- Overlay de Fin de Partida -->
    <div id="gameover-overlay" class="overlay hidden">
      <h1 id="gameover-title" style="background: linear-gradient(135deg, #ff2a6d, #ff9f1c); -webkit-background-clip: text;">FIN DEL JUEGO</h1>
      <p id="gameover-desc">Has perdido todas tus vidas.</p>
      <p style="font-size: 20px; color: #00f3ff; margin-bottom: 20px;">Puntuación Final: <span id="final-score">0</span></p>
      <button id="restart-btn" class="btn">REINTENTAR</button>
    </div>
  </div>

  <script>
    /* =========================================================
       SINTETIZADOR DE AUDIO (Web Audio API - Sin archivos externos)
       ========================================================= */
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.15) {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      paddleHit() {
        this.playTone(320, 'square', 0.08, 0.12);
      }

      brickHit(pitchMultiplier = 1) {
        const baseFreq = 440 * pitchMultiplier;
        this.playTone(baseFreq, 'triangle', 0.12, 0.2);
      }

      wallBounce() {
        this.playTone(200, 'sine', 0.05, 0.1);
      }

      laserShoot() {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.12);
          
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch(e) {}
      }

      powerup() {
        if (this.muted || !this.ctx) return;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sine', 0.12, 0.18), idx * 50);
        });
      }

      loseLife() {
        if (this.muted || !this.ctx) return;
        [280, 220, 160, 110].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sawtooth', 0.15, 0.2), idx * 70);
        });
      }

      winLevel() {
        if (this.muted || !this.ctx) return;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'triangle', 0.25, 0.25), idx * 90);
        });
      }
    }

    const audio = new RetroAudio();

    /* =========================================================
       CONFIGURACIÓN Y VARIABLES DEL JUEGO
       ========================================================= */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score-val');
    const highscoreEl = document.getElementById('highscore-val');
    const levelEl = document.getElementById('level-val');
    const livesContainer = document.getElementById('lives-container');
    const soundBtn = document.getElementById('sound-btn');

    const startOverlay = document.getElementById('start-overlay');
    const pauseOverlay = document.getElementById('pause-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const gameoverTitle = document.getElementById('gameover-title');
    const gameoverDesc = document.getElementById('gameover-desc');
    const finalScoreEl = document.getElementById('final-score');

    const startBtn = document.getElementById('start-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const restartBtn = document.getElementById('restart-btn');

    let score = 0;
    let highScore = 0;
    try {
      highScore = parseInt(localStorage.getItem('breakout_highscore') || '0', 10) || 0;
    } catch (e) {}
    let lives = 3;
    let level = 1;
    let combo = 0;
    let gameState = 'START'; // 'START', 'PLAYING', 'PAUSED', 'GAMEOVER'

    // Tipos de potenciadores
    const POWERUP_TYPES = {
      EXTEND: { label: '↔ PALA', color: '#00f3ff', desc: 'Pala más ancha' },
      LASER: { label: '⚡ LÁSER', color: '#ff2a6d', desc: 'Disparos láser' },
      MULTIBALL: { label: '✦ MULTI', color: '#ffd166', desc: 'Bolas múltiples' },
      FIREBALL: { label: '🔥 FUEGO', color: '#ff5e00', desc: 'Bola de fuego imparable' },
      LIFE: { label: '♥ VIDA', color: '#06d6a0', desc: 'Vida extra' },
      SHIELD: { label: '🛡 ESCUDO', color: '#9d4edd', desc: 'Barrera protectora' }
    };

    /* Paleta de bloques por fila/dureza */
    const BRICK_COLORS = [
      { fill: '#ff2a6d', glow: 'rgba(255, 42, 109, 0.6)', pts: 50 },
      { fill: '#ff9f1c', glow: 'rgba(255, 159, 28, 0.6)', pts: 40 },
      { fill: '#ffd166', glow: 'rgba(255, 209, 102, 0.6)', pts: 30 },
      { fill: '#06d6a0', glow: 'rgba(6, 214, 160, 0.6)', pts: 20 },
      { fill: '#00f3ff', glow: 'rgba(0, 243, 255, 0.6)', pts: 10 }
    ];

    /* =========================================================
       CLASES DEL JUEGO
       ========================================================= */

    // Pala (Paddle)
    class Paddle {
      constructor() {
        this.baseWidth = 110;
        this.width = this.baseWidth;
        this.height = 14;
        this.x = (canvas.width - this.width) / 2;
        this.y = canvas.height - 35;
        this.speed = 9;
        this.targetX = this.x;
        this.hasLaser = false;
        this.laserTimer = 0;
        this.extendedTimer = 0;
      }

      reset() {
        this.width = this.baseWidth;
        this.x = (canvas.width - this.width) / 2;
        this.targetX = this.x;
        this.hasLaser = false;
        this.laserTimer = 0;
        this.extendedTimer = 0;
      }

      extend() {
        this.width = 170;
        this.extendedTimer = 600; // ~10 segundos a 60 fps
      }

      enableLaser() {
        this.hasLaser = true;
        this.laserTimer = 600;
      }

      update() {
        this.targetX = Math.max(0, Math.min(canvas.width - this.width, this.targetX));
        // Suavizado de movimiento hacia la posición del mouse / táctil
        this.x += (this.targetX - this.x) * 0.35;

        // Limitar dentro del canvas
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

        // Temporizadores de power-ups
        if (this.extendedTimer > 0) {
          this.extendedTimer--;
          if (this.extendedTimer <= 0) this.width = this.baseWidth;
        }

        if (this.laserTimer > 0) {
          this.laserTimer--;
          if (this.laserTimer <= 0) this.hasLaser = false;
        }
      }

      draw(ctx) {
        ctx.save();
        
        // Brillo exterior
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.hasLaser ? '#ff2a6d' : (this.extendedTimer > 0 ? '#00f3ff' : '#00b4d8');

        // Cuerpo de la pala con gradiente
        const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.height);
        if (this.hasLaser) {
          grad.addColorStop(0, '#ff758c');
          grad.addColorStop(1, '#ff2a6d');
        } else {
          grad.addColorStop(0, '#70e000');
          grad.addColorStop(0.5, '#00f3ff');
          grad.addColorStop(1, '#0077b6');
        }
        ctx.fillStyle = grad;

        // Pala redondeada
        ctx.beginPath();
        ctx.roundRect(this.x, this.y, this.width, this.height, 7);
        ctx.fill();

        // Núcleo brillante interior
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.beginPath();
        ctx.roundRect(this.x + 8, this.y + 3, this.width - 16, 3, 2);
        ctx.fill();

        // Cañones de láser visuales si tiene la habilidad activa
        if (this.hasLaser) {
          ctx.fillStyle = '#ff2a6d';
          ctx.fillRect(this.x + 4, this.y - 6, 6, 6);
          ctx.fillRect(this.x + this.width - 10, this.y - 6, 6, 6);
        }

        ctx.restore();
      }
    }

    // Bola
    class Ball {
      constructor(x, y) {
        this.radius = 7;
        this.reset(x, y);
      }

      reset(x, y) {
        this.x = x || canvas.width / 2;
        this.y = y || canvas.height - 45;
        this.speed = 6.5;
        const angle = -Math.PI / 4 - (Math.random() * Math.PI / 2);
        this.dx = Math.cos(angle) * this.speed;
        this.dy = -Math.abs(Math.sin(angle) * this.speed);
        this.attached = true;
        this.isFireball = false;
        this.fireballTimer = 0;
        this.tail = [];
      }

      launch() {
        if (this.attached) {
          this.attached = false;
          audio.paddleHit();
        }
      }

      setFireball() {
        this.isFireball = true;
        this.fireballTimer = 480; // ~8 segundos
      }

      update(paddle) {
        if (this.attached) {
          this.x = paddle.x + paddle.width / 2;
          this.y = paddle.y - this.radius - 2;
          return;
        }

        // Efecto estela
        this.tail.unshift({ x: this.x, y: this.y, alpha: 0.6 });
        if (this.tail.length > 8) this.tail.pop();

        if (this.fireballTimer > 0) {
          this.fireballTimer--;
          if (this.fireballTimer <= 0) this.isFireball = false;
        }

        this.x += this.dx;
        this.y += this.dy;

        // Rebotes en los laterales
        if (this.x - this.radius <= 0) {
          this.x = this.radius;
          this.dx = Math.abs(this.dx);
          audio.wallBounce();
        } else if (this.x + this.radius >= canvas.width) {
          this.x = canvas.width - this.radius;
          this.dx = -Math.abs(this.dx);
          audio.wallBounce();
        }

        // Rebote techo
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.dy = Math.abs(this.dy);
          audio.wallBounce();
        }
      }

      draw(ctx) {
        ctx.save();

        // Estela
        for (let i = 0; i < this.tail.length; i++) {
          const t = this.tail[i];
          const fade = (1 - (i / this.tail.length)) * 0.4;
          ctx.fillStyle = this.isFireball ? `rgba(255, 94, 0, ${fade})` : `rgba(0, 243, 255, ${fade})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, this.radius * (1 - i * 0.08), 0, Math.PI * 2);
          ctx.fill();
        }

        // Brillo principal
        ctx.shadowBlur = 14;
        ctx.shadowColor = this.isFireball ? '#ff5e00' : '#00f3ff';

        ctx.fillStyle = this.isFireball ? '#ff9f1c' : '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Bloque (Brick)
    class Brick {
      constructor(x, y, width, height, maxHits, colorInfo) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.maxHits = maxHits;
        this.hits = maxHits;
        this.colorInfo = colorInfo;
        this.alive = true;
      }

      hit() {
        this.hits--;
        if (this.hits <= 0) {
          this.alive = false;
        }
      }

      draw(ctx) {
        if (!this.alive) return;

        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.colorInfo.glow;

        // Atenuar si tiene daño previo
        const alpha = 0.5 + (this.hits / this.maxHits) * 0.5;
        ctx.globalAlpha = alpha;

        const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.height);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.2, this.colorInfo.fill);
        grad.addColorStop(1, '#0b0c16');
        ctx.fillStyle = grad;

        ctx.beginPath();
        ctx.roundRect(this.x, this.y, this.width, this.height, 4);
        ctx.fill();

        // Borde fino
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Grieta si ha recibido daño
        if (this.hits < this.maxHits) {
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(this.x + this.width * 0.3, this.y + 2);
          ctx.lineTo(this.x + this.width * 0.5, this.y + this.height * 0.6);
          ctx.lineTo(this.x + this.width * 0.7, this.y + this.height - 2);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // Partículas de explosión
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
        this.size = Math.random() * 3 + 2;
        this.color = color;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.08; // ligera gravedad
        this.alpha -= this.decay;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Texto flotante de puntos (+100, Combo x2)
    class FloatingText {
      constructor(text, x, y, color = '#00f3ff') {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.alpha = 1;
        this.vy = -1.2;
      }

      update() {
        this.y += this.vy;
        this.alpha -= 0.02;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.font = 'bold 15px monospace';
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    // Cápsula de Potenciador (PowerUp)
    class PowerUp {
      constructor(x, y, typeKey) {
        this.x = x;
        this.y = y;
        this.width = 65;
        this.height = 20;
        this.typeKey = typeKey;
        this.info = POWERUP_TYPES[typeKey];
        this.vy = 2.2;
        this.alive = true;
      }

      update() {
        this.y += this.vy;
        if (this.y > canvas.height + 30) {
          this.alive = false;
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.info.color;

        ctx.fillStyle = '#0f111e';
        ctx.strokeStyle = this.info.color;
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.roundRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height, 10);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = this.info.color;
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.info.label, this.x, this.y);

        ctx.restore();
      }
    }

    // Proyectil Láser
    class LaserBeam {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 4;
        this.height = 14;
        this.vy = -10;
        this.alive = true;
      }

      update() {
        this.y += this.vy;
        if (this.y < -20) this.alive = false;
      }

      draw(ctx) {
        ctx.save();
        ctx.fillStyle = '#ff2a6d';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff2a6d';
        ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
        ctx.restore();
      }
    }

    /* =========================================================
       INSTANCIAS Y GESTIÓN DE NIVELES
       ========================================================= */
    const paddle = new Paddle();
    let balls = [new Ball()];
    let bricks = [];
    let particles = [];
    let floatingTexts = [];
    let powerups = [];
    let lasers = [];
    let hasShield = false;

    // Generar niveles
    function createLevel(lvl) {
      bricks = [];
      const rows = 5 + Math.min(lvl, 3);
      const cols = 9;
      const brickWidth = 76;
      const brickHeight = 22;
      const padding = 8;
      const offsetX = (canvas.width - (cols * (brickWidth + padding) - padding)) / 2;
      const offsetY = 50;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          // Patrones por nivel
          if (lvl === 2 && (r + c) % 2 === 1) continue; // Patrón damero
          if (lvl >= 3 && r === 2 && (c === 0 || c === cols - 1 || c === Math.floor(cols / 2))) continue;

          const colorIdx = (r + lvl - 1) % BRICK_COLORS.length;
          const colorInfo = BRICK_COLORS[colorIdx];
          
          // Dureza de bloque (1 a 3 golpes)
          let hits = 1;
          if (lvl >= 2 && r < 2) hits = 2;
          if (lvl >= 4 && r === 0) hits = 3;

          const bx = offsetX + c * (brickWidth + padding);
          const by = offsetY + r * (brickHeight + padding);
          bricks.push(new Brick(bx, by, brickWidth, brickHeight, hits, colorInfo));
        }
      }
    }

    function updateHUD() {
      scoreEl.textContent = score.toString().padStart(5, '0');
      highscoreEl.textContent = highScore.toString().padStart(5, '0');
      levelEl.textContent = level;

      // Render vidas con corazones
      livesContainer.innerHTML = '';
      for (let i = 0; i < lives; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart-icon';
        heart.textContent = '❤';
        livesContainer.appendChild(heart);
      }
    }

    function addScore(pts, x, y) {
      combo++;
      const multiplier = Math.min(combo, 8);
      const totalPts = pts * multiplier;
      score += totalPts;
      if (score > highScore) {
        highScore = score;
        try {
          localStorage.setItem('breakout_highscore', highScore);
        } catch (e) {}
      }
      floatingTexts.push(new FloatingText(`+${totalPts}${multiplier > 1 ? ` (x${multiplier})` : ''}`, x, y));
      updateHUD();
    }

    function spawnPowerUp(x, y) {
      // 25% de probabilidad de soltar un potenciador
      if (Math.random() < 0.28) {
        const keys = Object.keys(POWERUP_TYPES);
        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        powerups.push(new PowerUp(x, y, randomKey));
      }
    }

    function triggerPowerUp(typeKey) {
      audio.powerup();
      floatingTexts.push(new FloatingText(POWERUP_TYPES[typeKey].label, paddle.x + paddle.width / 2, paddle.y - 15, POWERUP_TYPES[typeKey].color));
      
      switch (typeKey) {
        case 'EXTEND':
          paddle.extend();
          break;
        case 'LASER':
          paddle.enableLaser();
          break;
        case 'MULTIBALL':
          const currentBalls = [...balls];
          currentBalls.forEach(b => {
            const b1 = new Ball(b.x, b.y);
            b1.attached = false;
            b1.dx = b.dx * 0.8 - b.dy * 0.5;
            b1.dy = b.dy * 0.8 + b.dx * 0.5;
            balls.push(b1);

            const b2 = new Ball(b.x, b.y);
            b2.attached = false;
            b2.dx = b.dx * 0.8 + b.dy * 0.5;
            b2.dy = b.dy * 0.8 - b.dx * 0.5;
            balls.push(b2);
          });
          break;
        case 'FIREBALL':
          balls.forEach(b => b.setFireball());
          break;
        case 'LIFE':
          lives = Math.min(lives + 1, 5);
          updateHUD();
          break;
        case 'SHIELD':
          hasShield = true;
          break;
      }
    }

    function shootLaser() {
      if (!paddle.hasLaser || gameState !== 'PLAYING') return;
      audio.laserShoot();
      lasers.push(new LaserBeam(paddle.x + 7, paddle.y - 6));
      lasers.push(new LaserBeam(paddle.x + paddle.width - 7, paddle.y - 6));
    }

    function createExplosion(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    /* =========================================================
       CONTROL DE CICLO DE JUEGO (GAME LOOP)
       ========================================================= */

    function resetRound() {
      combo = 0;
      paddle.reset();
      balls = [new Ball()];
      powerups = [];
      lasers = [];
    }

    function startNewGame() {
      score = 0;
      lives = 3;
      level = 1;
      hasShield = false;
      createLevel(level);
      resetRound();
      updateHUD();
      gameState = 'PLAYING';
      startOverlay.classList.add('hidden');
      gameoverOverlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
    }

    function nextLevel() {
      audio.winLevel();
      level++;
      createLevel(level);
      resetRound();
      updateHUD();
      floatingTexts.push(new FloatingText(`¡NIVEL ${level}!`, canvas.width / 2, canvas.height / 2, '#00f3ff'));
    }

    function gameOver(won = false) {
      gameState = 'GAMEOVER';
      finalScoreEl.textContent = score;
      if (won) {
        gameoverTitle.textContent = '¡VICTORIA!';
        gameoverDesc.textContent = '¡Completaste todos los niveles arcade!';
        gameoverTitle.style.background = 'linear-gradient(135deg, #06d6a0, #00f3ff)';
      } else {
        gameoverTitle.textContent = 'FIN DEL JUEGO';
        gameoverDesc.textContent = 'Te has quedado sin vidas.';
        gameoverTitle.style.background = 'linear-gradient(135deg, #ff2a6d, #ff9f1c)';
      }
      gameoverTitle.style.webkitBackgroundClip = 'text';
      gameoverOverlay.classList.remove('hidden');
    }

    // Comprobación de colisión AABB para bola vs rectángulo
    function checkBallBrickCollision(ball, brick) {
      if (!brick.alive) return false;

      // Encontrar punto más cercano del rectángulo a la bola
      const closestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.width));
      const closestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.height));

      const distX = ball.x - closestX;
      const distY = ball.y - closestY;
      const distSquared = (distX * distX) + (distY * distY);

      if (distSquared <= (ball.radius * ball.radius)) {
        if (!ball.isFireball) {
          // Determinar cara de rebote
          const overlapX = (ball.radius) - Math.abs(distX);
          const overlapY = (ball.radius) - Math.abs(distY);

          if (overlapX < overlapY) {
            ball.dx = -ball.dx;
            ball.x += (distX > 0 ? 1 : -1) * overlapX;
          } else {
            ball.dy = -ball.dy;
            ball.y += (distY > 0 ? 1 : -1) * overlapY;
          }
        }
        return true;
      }
      return false;
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      paddle.update();

      // Disparo automático de láser si está activo
      if (paddle.hasLaser && Math.random() < 0.08) {
        shootLaser();
      }

      // Actualizar bolas
      for (let i = balls.length - 1; i >= 0; i--) {
        const ball = balls[i];
        ball.update(paddle);

        if (ball.attached) continue;

        // Colisión con la pala
        if (
          ball.y + ball.radius >= paddle.y &&
          ball.y - ball.radius <= paddle.y + paddle.height &&
          ball.x >= paddle.x - ball.radius &&
          ball.x <= paddle.x + paddle.width + ball.radius &&
          ball.dy > 0
        ) {
          audio.paddleHit();
          combo = 0; // Reiniciar combo al tocar pala

          // Ángulo dinámico según dónde golpea la pala (-60° a +60°)
          const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          const maxAngle = (75 * Math.PI) / 180;
          const bounceAngle = hitPoint * maxAngle;
          const currentSpeed = Math.min(ball.speed * 1.02, 11);
          ball.speed = currentSpeed;
          ball.dx = Math.sin(bounceAngle) * ball.speed;
          ball.dy = -Math.cos(bounceAngle) * ball.speed;
          ball.y = paddle.y - ball.radius - 1;

          createExplosion(ball.x, ball.y, '#00f3ff', 5);
        }

        // Colisión con ladrillos
        for (const brick of bricks) {
          if (checkBallBrickCollision(ball, brick)) {
            brick.hit();
            audio.brickHit(1 + (combo % 10) * 0.08);
            createExplosion(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.colorInfo.fill, 10);

            if (!brick.alive) {
              addScore(brick.colorInfo.pts, brick.x + brick.width / 2, brick.y);
              spawnPowerUp(brick.x + brick.width / 2, brick.y + brick.height / 2);
            }
            break;
          }
        }

        // Rebote en escudo inferior si existe
        if (hasShield && ball.y + ball.radius >= canvas.height - 8) {
          ball.dy = -Math.abs(ball.dy);
          hasShield = false;
          audio.wallBounce();
          createExplosion(ball.x, canvas.height - 4, '#9d4edd', 20);
        }

        // Bola caída por el fondo
        if (ball.y - ball.radius > canvas.height) {
          balls.splice(i, 1);
        }
      }

      // Proyectiles láser
      for (let l = lasers.length - 1; l >= 0; l--) {
        const laser = lasers[l];
        laser.update();

        // Impacto de láser en bloque
        for (const brick of bricks) {
          if (
            brick.alive &&
            laser.x >= brick.x &&
            laser.x <= brick.x + brick.width &&
            laser.y >= brick.y &&
            laser.y <= brick.y + brick.height
          ) {
            laser.alive = false;
            brick.hit();
            audio.brickHit(1.5);
            createExplosion(laser.x, laser.y, '#ff2a6d', 6);
            if (!brick.alive) {
              addScore(brick.colorInfo.pts, brick.x + brick.width / 2, brick.y);
              spawnPowerUp(brick.x + brick.width / 2, brick.y + brick.height / 2);
            }
            break;
          }
        }

        if (!laser.alive) lasers.splice(l, 1);
      }

      // Victoria del nivel si todos los bloques murieron
      const activeBricks = bricks.filter(b => b.alive);
      if (activeBricks.length === 0) {
        if (level >= 5) {
          gameOver(true);
        } else {
          nextLevel();
        }
      // Si no quedan bolas vivas
      } else if (balls.length === 0) {
        lives--;
        audio.loseLife();
        updateHUD();
        if (lives > 0) {
          resetRound();
        } else {
          gameOver(false);
        }
      }

      // Potenciadores cayendo
      for (let p = powerups.length - 1; p >= 0; p--) {
        const pu = powerups[p];
        pu.update();

        // Recolección con la pala
        if (
          pu.y + pu.height / 2 >= paddle.y &&
          pu.y - pu.height / 2 <= paddle.y + paddle.height &&
          pu.x + pu.width / 2 >= paddle.x &&
          pu.x - pu.width / 2 <= paddle.x + paddle.width
        ) {
          triggerPowerUp(pu.typeKey);
          powerups.splice(p, 1);
          continue;
        }

        if (!pu.alive) powerups.splice(p, 1);
      }

      // Partículas
      for (let pt = particles.length - 1; pt >= 0; pt--) {
        particles[pt].update();
        if (particles[pt].alpha <= 0) particles.splice(pt, 1);
      }

      // Textos flotantes
      for (let f = floatingTexts.length - 1; f >= 0; f--) {
        floatingTexts[f].update();
        if (floatingTexts[f].alpha <= 0) floatingTexts.splice(f, 1);
      }
    }

    /* =========================================================
       RENDERIZADO GRÁFICO
       ========================================================= */
    function draw() {
      // Fondo y limpieza con ligero motion trail
      ctx.fillStyle = '#05050f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Rejilla arcade tenue en el fondo
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Dibujar escudo inferior si está activo
      if (hasShield) {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#9d4edd';
        ctx.strokeStyle = '#9d4edd';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 4);
        ctx.lineTo(canvas.width, canvas.height - 4);
        ctx.stroke();
        ctx.restore();
      }

      // Bloques
      bricks.forEach(brick => brick.draw(ctx));

      // Potenciadores
      powerups.forEach(pu => pu.draw(ctx));

      // Láseres
      lasers.forEach(laser => laser.draw(ctx));

      // Pala
      paddle.draw(ctx);

      // Bolas
      balls.forEach(ball => ball.draw(ctx));

      // Partículas
      particles.forEach(pt => pt.draw(ctx));

      // Textos flotantes
      floatingTexts.forEach(ft => ft.draw(ctx));
    }

    // Bucle principal de animación
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    /* =========================================================
       EVENTOS Y CONTROLES
       ========================================================= */

    // Movimiento con mouse
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      paddle.targetX = mouseX - paddle.width / 2;
    });

    // Clic o Espacio para lanzar bola o disparar láser
    function handleAction() {
      audio.init();
      if (gameState === 'PLAYING') {
        balls.forEach(b => b.launch());
        shootLaser();
      }
    }

    canvas.addEventListener('click', handleAction);

    // Controles táctiles para móviles / tablets
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const touchX = (e.touches[0].clientX - rect.left) * scaleX;
      paddle.targetX = touchX - paddle.width / 2;
    }, { passive: false });

    canvas.addEventListener('touchstart', (e) => {
      handleAction();
    }, { passive: true });

    // Controles de teclado
    const keys = {};
    window.addEventListener('keydown', (e) => {
      audio.init();
      keys[e.code] = true;

      if (e.code === 'Space') {
        e.preventDefault();
        handleAction();
      }

      if (e.code === 'KeyP' || e.code === 'Escape') {
        if (gameState === 'PLAYING') {
          gameState = 'PAUSED';
          pauseOverlay.classList.remove('hidden');
        } else if (gameState === 'PAUSED') {
          gameState = 'PLAYING';
          pauseOverlay.classList.add('hidden');
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Polling de teclas flechas para movimiento fluido continuo
    setInterval(() => {
      if (gameState === 'PLAYING') {
        if (keys['ArrowLeft'] || keys['KeyA']) {
          paddle.targetX -= paddle.speed;
        }
        if (keys['ArrowRight'] || keys['KeyD']) {
          paddle.targetX += paddle.speed;
        }
      }
    }, 1000 / 60);

    // Interfaz de botones
    startBtn.addEventListener('click', () => {
      audio.init();
      startNewGame();
    });

    resumeBtn.addEventListener('click', () => {
      gameState = 'PLAYING';
      pauseOverlay.classList.add('hidden');
    });

    restartBtn.addEventListener('click', () => {
      audio.init();
      startNewGame();
    });

    // Conmutador de Sonido
    soundBtn.addEventListener('click', () => {
      audio.init();
      audio.muted = !audio.muted;
      soundBtn.textContent = audio.muted ? '🔇' : '🔊';
    });

    // Inicializar HUD al cargar
    updateHUD();
  </script>
</body>
</html>
